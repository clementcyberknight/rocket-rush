name: Build and Push GHCR Image

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COOLIFY_API_URL: https://coolify.synxed.com/api/v1
  COOLIFY_API_APP_UUID: ${{ secrets.COOLIFY_API_APP_UUID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            PUBLIC_URL=/
            REACT_APP_SYNXED_API_KEY=${{ secrets.REACT_APP_SYNXED_API_KEY || secrets.SYNXED_API_KEY }}
            REACT_APP_SYNXED_SERVER_URL=${{ secrets.REACT_APP_SYNXED_SERVER_URL || secrets.SYNXED_SERVER_URL }}
            REACT_APP_SYNXED_PLAYLIST_CODE=${{ secrets.REACT_APP_SYNXED_PLAYLIST_CODE || secrets.SYNXED_PLAYLIST_CODE }}
            REACT_APP_SYNXED_ENABLE_VOICE=${{ vars.REACT_APP_SYNXED_ENABLE_VOICE || 'false' }}

      - name: Trigger Coolify redeploy
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "COOLIFY_API_TOKEN not set; image pushed, redeploy manually in Coolify."
            exit 0
          fi

          if [ -z "$COOLIFY_API_APP_UUID" ]; then
            echo "COOLIFY_API_APP_UUID not set; image pushed, redeploy manually in Coolify."
            exit 0
          fi

          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Cloudflare Access service token secrets are required for protected Coolify API."
            echo "Set CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET in GitHub Actions secrets."
            exit 1
          fi

          url="${COOLIFY_API_URL%/}/deploy?uuid=${COOLIFY_API_APP_UUID}&force=true"
          curl -sS -L --fail-with-body -X GET \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$url"
